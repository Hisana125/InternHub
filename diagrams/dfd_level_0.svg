<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" width="100%" height="100%" style="background-color: white; font-family: Arial, sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="black" />
        </marker>
    </defs>

    <!-- Top Entity: Admin -->
    <rect x="530" y="60" width="240" height="105" fill="none" stroke="black" stroke-width="2" />
    <text x="650" y="120" font-size="18" text-anchor="middle" fill="black">Admin</text>

    <!-- Central Process: College Internship Management System -->
    <ellipse cx="650" cy="470" rx="175" ry="80" fill="none" stroke="black" stroke-width="2" />
    <text x="650" y="462" font-size="17" text-anchor="middle" fill="black">College Internship</text>
    <text x="650" y="488" font-size="17" text-anchor="middle" fill="black">Management System</text>

    <!-- Left Entity: Student -->
    <rect x="80" y="417.5" width="240" height="105" fill="none" stroke="black" stroke-width="2" />
    <text x="200" y="476" font-size="18" text-anchor="middle" fill="black">Student</text>

    <!-- Right Entity: Company -->
    <rect x="980" y="417.5" width="240" height="105" fill="none" stroke="black" stroke-width="2" />
    <text x="1100" y="476" font-size="18" text-anchor="middle" fill="black">Company</text>

    <!-- Admin Flows -->
    <line x1="610" y1="165" x2="610" y2="390" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="550" y="280" font-size="14" fill="black">Request</text>

    <line x1="690" y1="390" x2="690" y2="165" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="725" y="280" font-size="14" fill="black">Response</text>

    <!-- Student Flows -->
    <line x1="320" y1="440" x2="475" y2="440" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="395" y="420" font-size="14" text-anchor="middle" fill="black">Request</text>

    <line x1="475" y1="500" x2="320" y2="500" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="395" y="530" font-size="14" text-anchor="middle" fill="black">Response</text>

    <!-- Company Flows -->
    <line x1="980" y1="440" x2="825" y2="440" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="905" y="420" font-size="14" text-anchor="middle" fill="black">Request</text>

    <line x1="825" y1="500" x2="980" y2="500" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="905" y="530" font-size="14" text-anchor="middle" fill="black">Response</text>
</svg>