{% extends 'base.html' %}

{% block title %}Student Login — InternHub{% endblock %}

{% block content %}
<div class="container-sm" style="margin-top: 2rem;">
    <div class="form-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🔐</div>
            <h1 class="card-title" style="font-size: 1.75rem;">Student Login</h1>
            <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.35rem;">
                Access your InternHub student dashboard and applications
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label for="password" class="form-label" style="margin: 0;">Password</label>
                </div>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Sign In to Portal &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account?
            <a href="{% url 'student_register' %}" style="font-weight: 700; margin-left: 0.25rem;">
                Register as a Student
            </a>
        </div>
    </div>
</div>
{% endblock %}
